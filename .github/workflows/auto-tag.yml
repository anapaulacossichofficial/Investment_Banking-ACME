name: Auto Tag Main Commit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create next version tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force

          latest_tag="$(
            git tag --list 'v0.4.*' --sort=-version:refname |
            head -n 1
          )"

          if [ -z "$latest_tag" ]; then
            next_tag="v0.4.0"
          else
            current_patch="${latest_tag##*.}"
            next_patch=$((current_patch + 1))
            next_tag="v0.4.${next_patch}"
          fi

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists."
            exit 1
          fi

          git tag -a "$next_tag" -m "Automatic version tag $next_tag"
          git push origin "$next_tag"

          echo "Created tag: $next_tag"
