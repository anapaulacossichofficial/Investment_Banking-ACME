observability:
  tracing:
    trace_requests: true
    trace_agent_handoffs: true
    trace_retrieval_events: true
    trace_citation_generation: true
    trace_fallback_events: true
    trace_scope_resolution: true
    trace_route_selection: true

  metrics:
    retrieval_latency: true
    grounding_bundle_size: true
    citation_coverage_rate: true
    fallback_rate: true
    hallucination_rejection_rate: true
    guardrail_event_rate: true
    route_accuracy_rate: true

  logging:
    log_prompt_version: true
    log_data_sources_used: true
    log_missing_evidence_events: true
    log_hallucination_rejection_events: true
    log_contract_validation: true

  alerts:
    high_fallback_rate_threshold: 0.20
    missing_citation_threshold: 0.01

  evidence:
    preserve_test_outputs: true
    preserve_validation_artifacts: true

  alignment:
    local_runtime_role: "Local engineering evidence for target runtime patterns"
    target_runtime_mapping:
      - agentforce_session_tracing
      - source_attribution
      - fallback_monitoring
      - guardrail_event_monitoring