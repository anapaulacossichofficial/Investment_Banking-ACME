decision:
  primary_recommendation: dmo_backed_data_cloud_retriever
  architecture_pattern: hybrid_retrieval
  architecture_role: target_state
  status: approved_for_solution_design

rationale:
  - structured_crm_facts_remain_authoritative
  - semantic_search_with_metadata_filters_for_approved_documents
  - account_and_contact_scope_lock
  - better_fit_for_financial_research_and_relationship_documents
  - scalable_reuse_for_future_agents
  - stronger_architecture_judgment_for_enterprise_ib

retrieval_contract:
  sequence:
    - resolve_account_and_contact_scope
    - retrieve_structured_crm_context
    - retrieve_scoped_unstructured_knowledge
    - assemble_evidence_context
    - validate_sources_and_guardrails
    - generate_grounded_briefing_with_citations
    - return_fallback_when_evidence_is_missing_or_ambiguous

  structured_facts:
    target_source: salesforce_crm_and_data_cloud_business_entities
    examples:
      - accounts
      - contacts
      - opportunities
      - activities
      - relationship_records
    requirements:
      - deterministic_record_relationships
      - account_scope_required
      - contact_scope_required_when_present
      - no_inferred_financial_values

  unstructured_knowledge:
    target_source: dmo_backed_data_cloud_retrieval
    examples:
      - relationship_notes
      - pitch_decks
      - research_documents
      - meeting_notes
      - internal_briefs
    requirements:
      - approved_source_only
      - semantic_search
      - metadata_filters
      - account_scope_required_when_metadata_available
      - source_attribution_required_when_evidence_is_used

runtime_profiles:
  demo:
    enabled_strategy: controlled_grounding_layer
    architecture_contract: hybrid_retrieval
    structured_source: local_structured_fixtures
    unstructured_source: local_approved_documents
    purpose:
      - deterministic_demo_behavior
      - local_testing
      - stable_citation_output
      - lower_integration_risk
      - evidence_for_target_contract

  target:
    enabled_strategy: dmo_backed_data_cloud_retriever
    architecture_contract: hybrid_retrieval
    structured_source: salesforce_crm_or_data_cloud
    unstructured_source: dmo_backed_enterprise_knowledge
    purpose:
      - enterprise_scale
      - governance
      - reusable_retrieval_for_30_plus_agents
      - semantic_search_with_metadata_filtering

tradeoffs:
  data_library:
    role: valid_out_of_box_alternative
    strengths:
      - faster_setup
      - simpler_knowledge_grounding_configuration
      - suitable_for_lightweight_knowledge_articles_and_text_content
    limitations_for_this_case:
      - less_control_for_metadata_rich_retrieval
      - weaker_fit_as_primary_pattern_for_dense_financial_document_sets
      - less_defensible_for_strict_account_contact_document_scoping

  controlled_grounding_layer:
    role: demo_runtime_implementation
    strengths:
      - faster_setup
      - deterministic_behavior_for_panel
      - stable_citation_and_fallback_tests
      - lower_integration_risk
    limitations:
      - does_not_prove_live_data_cloud_behavior
      - weaker_metadata_filtering_than_target_state
      - less_scalable_for_multi_agent_reuse

  dmo_backed_data_cloud_retriever:
    role: approved_target_architecture
    strengths:
      - semantic_search_with_metadata_filters
      - richer_document_segmentation_control
      - stronger_governance_and_scope_enforcement
      - stronger_fit_for_financial_research_scale
      - easier_extension_to_multi_agent_future_state
    limitations:
      - higher_setup_complexity
      - data_cloud_ingestion_mapping_and_index_dependencies
      - asynchronous_readiness_and_operational_monitoring_required

selection_rules:
  - if: environment == "local_demo"
    use: controlled_grounding_layer
  - if: environment == "test"
    use: controlled_grounding_layer
  - if: environment == "target_architecture"
    use: dmo_backed_data_cloud_retriever
  - if: environment == "production"
    use: dmo_backed_data_cloud_retriever
